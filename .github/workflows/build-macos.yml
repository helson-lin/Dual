name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to publish a GitHub Release, e.g. v1.0.0"
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            label: intel
          - runner: macos-15
            arch: arm64
            label: apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DMG styling tools
        run: |
          python3 -m venv "$PWD/.build/dmg-python-venv"
          "$PWD/.build/dmg-python-venv/bin/python" -m pip install --upgrade pip
          "$PWD/.build/dmg-python-venv/bin/python" -m pip install dmgbuild
          "$PWD/.build/dmg-python-venv/bin/python" -c "import ds_store, mac_alias"

      - name: Build release artifact
        id: package
        env:
          ARCH: ${{ matrix.arch }}
          ARTIFACT_LABEL: ${{ matrix.label }}
          DEPLOYMENT_TARGET: 12.0
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          chmod +x scripts/build-release.sh
          export DMGBUILD_PYTHONPATH="$("$PWD/.build/dmg-python-venv/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          echo "DMGBUILD_PYTHONPATH=$DMGBUILD_PYTHONPATH"
          if [[ -n "$RELEASE_TAG" || "$GITHUB_REF_TYPE" == "tag" ]]; then
            export BUILD_NUMBER_OVERRIDE="$GITHUB_RUN_NUMBER"
          fi
          ./scripts/build-release.sh

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: Dual-macos-${{ matrix.label }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.artifact_sha256_path }}
            ${{ steps.package.outputs.dmg_sha256_path }}
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TOKEN: ${{ secrets.TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ env.TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --generate-notes
          find dist -type f -maxdepth 2 -print0 | while IFS= read -r -d '' file; do
            gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$file"
          done

      - name: Sync Homebrew tap
        if: env.TOKEN != ''
        env:
          DIST_DIR: dist
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          TAP_GIT_TOKEN: ${{ env.TOKEN }}
        run: |
          chmod +x scripts/sync-homebrew-tap.sh
          ./scripts/sync-homebrew-tap.sh
