<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 28px 30px 26px;
  color: -apple-system-label;
  font: -apple-system-body;
  line-height: 1.45;
}
main { max-width: 520px; margin: 0 auto; }
h1 { margin: 0 0 6px; font: -apple-system-headline; font-weight: 700; }
.lead { margin: 0 0 22px; color: -apple-system-secondary-label; }
section { margin-top: 22px; padding-top: 18px; border-top: 1px solid -apple-system-separator; }
h2 { margin: 0 0 8px; font: -apple-system-subheadline; font-weight: 600; }
p { margin: 0 0 10px; }
a { color: -apple-system-link; text-decoration: none; }
.notice { padding: 12px 14px; border-radius: 10px; background: -apple-system-secondary-system-fill; }
.small { color: -apple-system-secondary-label; font-size: 0.92em; }
</style>
</head>
<body>
<main>
<h1>Dual</h1>
<p class="lead">应用信息与许可</p>
<section>
<h2>许可证</h2>
<p class="notice">Dual 采用 GNU GPLv3，并附加 Commons Clause 条款。除非版权所有者明确书面许可，否则仅限个人、非商业使用。</p>
<p class="small">衍生作品必须继续使用相同许可证条款。完整条款请参阅项目中的 LICENSE 文件。</p>
</section>
<section>
<h2>项目</h2>
<p><a href="https://github.com/helson-lin/Dual">在 GitHub 上查看 Dual</a></p>
</section>
<section>
<h2>第三方组件</h2>
<p>Sparkle，基于 MIT 许可证。</p>
<p><a href="https://github.com/sparkle-project/Sparkle">查看 Sparkle 项目</a></p>
</section>
</main>
</body>
</html>
